services:
  db:
    image: postgres:16
    container_name: ltgt_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:?Define POSTGRES_DB en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ltgt_net

  backend:
    build:
      context: ./backend
      target: runner
    container_name: ltgt_backend
    restart: always
    env_file:
      - ./backend/.env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "4000"
    networks:
      - ltgt_net

  frontend:
    build:
      context: ./frontend
    container_name: ltgt_frontend
    restart: always
    env_file:
      - ./frontend/.env.production
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    networks:
      - ltgt_net

networks:
  ltgt_net:

volumes:
  pgdata:
